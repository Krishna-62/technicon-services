# Fly.io deployment config for the TECHNICON SERVICES backend.
# App name must be globally unique on Fly.io — change it here (and note the new
# hostname) if 'technicon-services-api' is already taken when you run `fly launch`.
app = "technicon-services-api"
primary_region = "bom"  # Mumbai — closest region to Hyderabad; change if you prefer another

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "4000"
  # Set after you know your Vercel URL: fly secrets set CLIENT_ORIGIN=https://your-app.vercel.app
  # (Left unset here on purpose — CORS falls back to allowing any origin until you set this.)

[[mounts]]
  source = "technicon_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 256mb/shared-1x keeps this within Fly.io's free allowance (3 shared-cpu-1x-256mb VMs).
  # Bump this if the app feels slow under real load.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
